<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
    />
    <style>
      /* Solo para el loader de arranque; el resto de los estilos llega con la app. */
      html, body { margin: 0; height: 100%; background: #1b1f1e; }
      @media (prefers-color-scheme: light) { html, body { background: #e6e4dd; } }
      .boot-loader { height: 100vh; display: grid; place-items: center; }
      .bn { transform-box: fill-box; transform-origin: center; animation: 2.4s cubic-bezier(.45,0,.55,1) infinite; }
      .bn.n1 { animation-name: bn1; } .bn.n2 { animation-name: bn2; } .bn.n3 { animation-name: bn3; }
      .bp { stroke-width: 18; stroke-linecap: round; stroke-dasharray: 34 200; stroke-dashoffset: 34; opacity: 0; animation: 2.4s cubic-bezier(.45,0,.55,1) infinite; }
      .bp.p1 { animation-name: bp1; } .bp.p2 { animation-name: bp2; }
      @keyframes bn1 { 0% { transform: scale(1) } 14.58% { transform: scale(1.16) } 29.17%, 100% { transform: scale(1) } }
      @keyframes bn2 { 0%, 33.33% { transform: scale(1) } 45.83% { transform: scale(1.16) } 58.33%, 100% { transform: scale(1) } }
      @keyframes bn3 { 0%, 64.58% { transform: scale(1) } 77.08% { transform: scale(1.16) } 91.67%, 100% { transform: scale(1) } }
      @keyframes bp1 { 0%, 8.33% { stroke-dashoffset: 34; opacity: 0 } 12.5%, 37.5% { opacity: 1 } 41.67%, 100% { stroke-dashoffset: -100; opacity: 0 } }
      @keyframes bp2 { 0%, 43.75% { stroke-dashoffset: 34; opacity: 0 } 47.92%, 66.67% { opacity: 1 } 70.83%, 100% { stroke-dashoffset: -100; opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .bn, .bp { animation: none; } }
    </style>
    <title>Redes semánticas · Madre de Dios</title>
  </head>
  <body>
    <div id="root">
      <!-- Loader de arranque: se ve hasta que React monta la app (src/components/Loader.tsx). -->
      <div class="boot-loader" role="status" aria-label="Cargando">
        <svg width="96" height="96" viewBox="0 0 320 320" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="boot-a" x1="106" y1="222" x2="184" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#6BC8CC" /><stop offset="1" stop-color="#8BCB2E" /></linearGradient>
            <linearGradient id="boot-b" x1="184" y1="80" x2="220" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#8BCB2E" /><stop offset="1" stop-color="#858DCC" /></linearGradient>
          </defs>
          <g transform="rotate(45 160 160)">
            <g stroke-width="9" stroke-linecap="round"><path d="M106 222 184 80" stroke="url(#boot-a)" /><path d="M184 80 220 180" stroke="url(#boot-b)" /></g>
            <path class="bp p1" d="M106 222 184 80" pathLength="100" stroke="url(#boot-a)" />
            <path class="bp p2" d="M184 80 220 180" pathLength="100" stroke="url(#boot-b)" />
            <circle class="bn n1" cx="106" cy="222" r="48" fill="#6BC8CC" />
            <circle class="bn n2" cx="184" cy="80" r="36" fill="#8BCB2E" />
            <circle class="bn n3" cx="220" cy="180" r="22" fill="#858DCC" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
