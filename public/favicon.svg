<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Red de tres nodos girada 45 grados</title>
  <desc id="desc">Logo de tres nodos de distintos tamaños, girado 45 grados en sentido horario. Fondo transparente.</desc>
  <defs>
    <linearGradient id="principal" x1="106" y1="222" x2="184" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BC8CC"/><stop offset="1" stop-color="#8BCB2E"/>
    </linearGradient>
    <linearGradient id="secundaria" x1="184" y1="80" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BCB2E"/><stop offset="1" stop-color="#858DCC"/>
    </linearGradient>
  </defs>
  <g transform="rotate(45 160 160)">
    <g stroke-width="9" stroke-linecap="round">
      <path d="M106 222 184 80" stroke="url(#principal)"/>
      <path d="M184 80 220 180" stroke="url(#secundaria)"/>
    </g>
    <circle cx="106" cy="222" r="48" fill="#6BC8CC"/>
    <circle cx="184" cy="80" r="36" fill="#8BCB2E"/>
    <circle cx="220" cy="180" r="22" fill="#858DCC"/>
  </g>
</svg>
